<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deal Board</title>
<meta name="theme-color" content="#1C1C1E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#1C1C1E; --card:#27272A; --card2:#303034; --line:#3A3A3E; --text:#E4E4E4; --muted:#A3A3A8;
  --btn:#36363B; --btn-text:#E4E4E4; --tab:#2C2C30; --tab-on:#4A4A52;
  --dot-ok:#4FA88A; --dot-stale:#D9A03F; --dot-prop:#8A8A92; --dot-high:#C45C5C; --dot-low:#6B6B72; --rail-normal:#5C7FB8;
}
:root[data-theme="light"]{
  --bg:#F4F1EA; --card:#FFFFFF; --card2:#F7F4EE; --line:#DAD5C9; --text:#1F1F1F; --muted:#5C5C60;
  --btn:#E9E4D8; --btn-text:#1F1F1F; --tab:#E9E4D8; --tab-on:#CFC8B8;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:400 17px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;padding:0 14px 100px;max-width:680px;margin:0 auto}
button{font:inherit;color:var(--btn-text);background:var(--btn);border:0;border-radius:10px;padding:10px 12px;min-height:42px}
button:disabled{opacity:.5}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 0 8px}
h1{font-size:21px;font-weight:500;margin:0}
.hdr-btns{display:flex;gap:8px}
.hdr-btns button{padding:8px 12px;min-height:38px;font-size:15px}
.tabs{display:flex;gap:6px;margin:6px 0 12px}
.tabs button{flex:1;background:var(--tab);padding:10px 6px;font-size:15px}
.tabs button.on{background:var(--tab-on);font-weight:500}
.strip{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:15px;margin:0 2px 12px}
.strip span{display:inline-flex;align-items:center;gap:6px}
.dot{width:13px;height:13px;border-radius:50%;flex:none;display:inline-block}
.d-ok{background:var(--dot-ok)} .d-stale{background:var(--dot-stale)} .d-prop{background:var(--dot-prop)} .d-high{background:var(--dot-high)} .d-low{background:var(--dot-low)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.card-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.card-h .name{flex:1;font-size:19px;font-weight:500}
.card-h .sub{color:var(--muted);font-size:14px;font-weight:400;display:block}
.card-h button{padding:8px 12px;min-height:38px;font-size:14px}
.cstrip{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid var(--line);color:var(--muted);font-size:14px}
.cstrip button{padding:6px 10px;min-height:34px;font-size:13px;background:var(--card2);border:1px solid var(--line)}
.row{padding:11px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row{border-left:6px solid transparent}
.row.p1{border-left-color:var(--dot-high)} .row.p2{border-left-color:var(--rail-normal)} .row.p3{border-left-color:var(--dot-low)}
.pinfo,.ccard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.pinfo .t,.ccard .t{display:flex;align-items:center;gap:10px}
.pinfo .t .n{flex:1;font-size:19px;font-weight:500}
.ccard .t .n{flex:1;font-size:18px;font-weight:500}
.pinfo .t button,.ccard .t button{padding:7px 11px;min-height:36px;font-size:14px}
.pinfo .s,.ccard .s{color:var(--muted);font-size:15px;margin-top:4px}
.pinfo .k,.ccard .k{margin-top:8px;font-size:15px;white-space:pre-wrap}
.ccard .k{margin-top:5px}
.lbl{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.8px;margin-top:10px}
.pinfo textarea,.ccard textarea{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:15px;min-height:70px;margin-top:4px}
.pinfo input,.ccard input,.ccard select{font-size:15px;padding:10px;margin-top:4px}
.row .l1{display:flex;align-items:flex-start;gap:9px}
.row .num{color:var(--muted);min-width:20px;font-size:15px;padding-top:2px}
.row .txt{flex:1}
.row .days{font-size:17px;font-weight:500;min-width:36px;text-align:right;padding-top:1px}
.row .l2{color:var(--muted);font-size:14px;margin:3px 0 0 29px}
.row .l2 b{font-weight:500;color:var(--text)}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 0 29px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:3px 9px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0 0 29px}
.acts button{padding:7px 11px;min-height:36px;font-size:14px;background:var(--card2);border:1px solid var(--line)}
.acts button.primary{background:var(--btn)}
.npanel{margin:9px 0 0 29px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px 12px 12px}
.npanel .lbl:first-child{margin-top:2px}
.npanel .acts button{background:var(--btn)}
.note{padding:7px 0;border-bottom:1px solid var(--line);font-size:15px;white-space:pre-wrap}
.note:last-of-type{border-bottom:0}
.note .nm{color:var(--muted);font-size:13px;margin-top:2px}
.nadd{display:flex;gap:6px;margin-top:8px}
.nadd input{flex:1;font-size:15px;padding:10px;min-width:0}
.nadd button{min-height:42px;flex:none}
.file{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}
.file:last-of-type{border-bottom:0}
.file .fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .fn a{color:var(--text);text-decoration:underline;text-underline-offset:3px}
.file .fm{color:var(--muted);font-size:13px;flex:none}
.file button{padding:5px 9px;min-height:32px;font-size:13px;flex:none}
.quiet{color:var(--muted);font-size:14px;padding:4px 0}
.h2row{display:flex;align-items:center;gap:10px;margin:18px 2px 8px}
.h2row h2{flex:1;margin:0}
.h2row button{padding:6px 11px;min-height:34px;font-size:14px}
h2{font-size:14px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:18px 2px 8px}
.empty{color:var(--muted);padding:30px 0;text-align:center}
form.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0 16px}
label{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}
input,select{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;font-size:17px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wide{margin-top:14px;width:100%;padding:14px;font-weight:500;border:1px solid var(--line)}
.msg{color:var(--muted);font-size:15px;margin-top:10px;min-height:20px}
.fab{position:fixed;right:14px;bottom:18px;border-radius:28px;padding:14px 20px;font-weight:500;border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.3)}
.chips{display:flex;gap:6px;margin:0 0 10px}
.chips button{padding:7px 12px;min-height:36px;font-size:14px;background:var(--tab)}
.chips button.on{background:var(--tab-on);font-weight:500}
.chat{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.bub{max-width:92%;padding:10px 13px;border-radius:14px;white-space:pre-wrap;font-size:16px;line-height:1.4}
.bub.u{align-self:flex-end;background:var(--tab-on)}
.bub.a{align-self:flex-start;background:var(--card);border:1px solid var(--line)}
.bub.s{align-self:center;background:transparent;color:var(--muted);font-size:14px}
.ask{display:flex;gap:8px;align-items:flex-end}
.ask textarea{flex:1;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:11px;font:inherit;font-size:16px;min-height:48px;max-height:140px;resize:vertical}
.ask button{min-height:48px}
.keybox{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--muted);font-size:14px}
.keybox summary{cursor:pointer;min-height:36px;display:flex;align-items:center}
.keybox input{margin-top:8px;font-size:15px}
.brief{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.brief .t{display:flex;align-items:center;gap:10px}
.brief .t .n{flex:1;font-size:16px;font-weight:500}
.brief .t button{padding:7px 11px;min-height:36px;font-size:14px}
.brief .b{white-space:pre-wrap;font-size:15px;margin-top:8px;line-height:1.45}
.brief .s{color:var(--muted);font-size:13px;margin-top:6px}
.sugg{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px;align-self:stretch;white-space:pre-wrap}
.sugg .acts{margin:8px 0 0}
.fab2{position:fixed;left:14px;bottom:18px;border-radius:28px;padding:14px 20px;font-weight:500;border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.3)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:15px;box-shadow:0 4px 14px rgba(0,0,0,.3);max-width:90vw;z-index:5}
.hidden{display:none!important}
.foot{color:var(--muted);font-size:13px;margin-top:18px;text-align:center}
</style>
</head>
<body>
<header>
  <h1>Deal Board</h1>
  <div class="hdr-btns">
    <button id="themeBtn" aria-label="Switch light or dark">Light</button>
    <button id="refreshBtn" class="hidden">Refresh</button>
    <button id="outBtn" class="hidden">Sign out</button>
  </div>
</header>

<section id="login" class="hidden">
  <form id="loginForm" class="panel">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" placeholder="you@example.com" required>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" minlength="8" required>
    <button class="wide" type="submit">Sign in</button>
    <button class="wide" type="button" id="signupBtn">First time: create login</button>
    <div class="msg" id="loginMsg"></div>
  </form>
</section>

<section id="board" class="hidden">
  <div class="tabs">
    <button data-v="worklist" class="on">Worklist</button>
    <button data-v="people">People</button>
    <button data-v="projects">Projects</button>
    <button data-v="bot">Bot</button>
  </div>
  <div class="strip" id="strip"></div>
  <form id="addForm" class="panel hidden">
    <label for="fFor">What are we waiting for?</label><input id="fFor" required placeholder="e.g. Permits">
    <label for="fOn">From whom? (type Me if it's our own task)</label><input id="fOn" list="people" required placeholder="e.g. Jan & Lazarus">
    <datalist id="people"></datalist>
    <label for="fBlocks">What does it block?</label><input id="fBlocks" placeholder="e.g. Maize loads">
    <label for="fNext">Next step</label><input id="fNext" placeholder="e.g. WhatsApp on Monday">
    <div class="two">
      <div><label for="fProject">Project</label>
      <select id="fProject"><option>Transport</option><option>Chrome</option><option>Buyer search</option><option>Verve admin</option><option>Other</option></select></div>
      <div><label for="fPrio">Priority</label>
      <select id="fPrio"><option value="1">High</option><option value="2" selected>Normal</option><option value="3">Low</option></select></div>
    </div>
    <label for="fOwner">Who on our side owns it?</label>
    <select id="fOwner"><option>Chris</option><option>Annemarie</option></select>
    <button class="wide" type="submit">Add</button>
    <div class="msg" id="addMsg"></div>
  </form>
  <div id="list"></div>
  <div class="foot" id="foot"></div>
</section>

<button class="fab hidden" id="addBtn">+ Add</button>
<button class="fab2 hidden" id="botFab">Bot</button>
<input type="file" id="fileInput" class="hidden">
<div id="toast" class="toast hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const APP_VERSION = "9";
const SB_URL = "https://egirxhjfgkwqjgxfxzea.supabase.co";
const SB_KEY = "sb_publishable_DBmbsxFvICXh7XFwWM9XlQ_TtvuUaMM";
const DEMO = new URLSearchParams(location.search).has("demo");
const PROJECTS = ["Transport", "Chrome", "Buyer search", "Verve admin", "Other"];
const sb = window.supabase.createClient(SB_URL, SB_KEY);
const $ = id => document.getElementById(id);
let view = "worklist"; try { view = localStorage.getItem("view") || "worklist"; } catch(e){}
if (view === "todo") view = "worklist";
let who = ""; try { who = localStorage.getItem("who") || "" } catch(e){}
let chat = []; let botBusy = false;
let me = "";
const openPanels = new Set();   // "item:<id>", "contact:<id>", "project:<name>"
let editContact = null;         // contact id being edited
let newContact = null;          // {} or {name} when the new-contact form is open
let pendingAttach = null;       // {type, id} waiting for a file pick

function setTheme(t){ document.documentElement.dataset.theme = t; $("themeBtn").textContent = t === "light" ? "Dark" : "Light";
  document.querySelector('meta[name="theme-color"]').content = t === "light" ? "#F4F1EA" : "#1C1C1E";
  try{ localStorage.setItem("theme", t) }catch(e){} }
let saved = "dark"; try{ saved = localStorage.getItem("theme") || "dark" }catch(e){}
setTheme(saved);
$("themeBtn").onclick = () => setTheme(document.documentElement.dataset.theme === "light" ? "dark" : "light");

const esc = s => (s ?? "").toString().replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const daysSince = d => d ? Math.max(0, Math.floor((Date.now() - new Date(d).getTime())/86400000)) : 0;
const isMe = it => /^(me|us|chris & annemarie)$/i.test((it.waiting_on || "").trim());
const fmtWhen = d => new Date(d).toLocaleString("en-ZA", { timeZone: "Africa/Johannesburg", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
const fmtSize = n => n > 1048576 ? (n/1048576).toFixed(1) + " MB" : Math.max(1, Math.round((n||0)/1024)) + " KB";
const firstName = n => (n || "").split(/[\s(&,]/)[0];
const toWa = p => { let d = (p || "").replace(/\D/g, ""); if (!d) return ""; if (d.startsWith("00")) d = d.slice(2); if (d.length === 10 && d[0] === "0") d = "27" + d.slice(1); else if (d.length === 9) d = "27" + d; return d; };
const notesFor = id => (window._notes || []).filter(n => n.item_id === id);
const attsFor = (type, id) => (window._atts || []).filter(a => a.target_type === type && String(a.target_id) === String(id));
const contactsFor = name => { const low = (name || "").toLowerCase(); return (window._contacts || []).filter(c => { const cn = (c.name || "").toLowerCase(); const f = firstName(cn); return low === cn || (f.length > 2 && new RegExp("\\b" + f.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\b").test(low)); }); };
let toastT; function toast(msg, ms){ $("toast").textContent = msg; $("toast").classList.remove("hidden"); clearTimeout(toastT); if (ms !== 0) toastT = setTimeout(() => $("toast").classList.add("hidden"), ms || 3000); }

function demoItems(){
  const d = n => new Date(Date.now() - n*864e5).toISOString();
  return [
    {id:"1",project:"Transport",waiting_on:"Jan & Lazarus",waiting_for:"Permits",blocks:"Maize loads",next_action:"Chase",state:"Proposed",priority:1,owner:"Chris",nudge_after_days:3,last_chased:null,created_at:d(4)},
    {id:"2",project:"Transport",waiting_on:"Jan & Lazarus",waiting_for:"VAT: is R350/t including or excluding VAT?",blocks:"The whole split",next_action:"Ask in writing",state:"Confirmed",priority:1,owner:"Chris",nudge_after_days:3,last_chased:d(1),created_at:d(1)},
    {id:"3",project:"Transport",waiting_on:"Adrian",waiting_for:"Truck packs, spreadsheet, tracker logins",blocks:"Client onboarding",next_action:"After contract",state:"Confirmed",priority:2,owner:"Chris",nudge_after_days:3,last_chased:null,created_at:d(0)},
    {id:"4",project:"Chrome",waiting_on:"Piet",waiting_for:"NDNCA",blocks:"ICPO, then stockpile test",next_action:"Chase Piet",state:"Proposed",priority:1,owner:"Chris",nudge_after_days:3,last_chased:null,created_at:d(1)},
    {id:"5",project:"Verve admin",waiting_on:"Me",waiting_for:"Logo file into site header + Formspree ID",blocks:"Website go-live",next_action:"Upload logo",state:"Confirmed",priority:2,owner:"Chris",nudge_after_days:3,last_chased:null,created_at:d(2)},
    {id:"6",project:"Verve admin",waiting_on:"Annemarie",waiting_for:"Add Chris as CIPC director",blocks:"Bank FICA",next_action:"File CoR39",state:"Proposed",priority:2,owner:"Annemarie",nudge_after_days:3,last_chased:null,created_at:d(0)}
  ];
}
function demoExtras(){
  const d = n => new Date(Date.now() - n*864e5).toISOString();
  window._contacts = [
    {id:"c1",name:"Lazarus",phone:"078 219 5810",whatsapp:"27782195810",email:"",company:"",role:"Client-side intermediary (with Jan)",project:"Transport",notes:"Unverified.",created_by:"claude",updated_at:d(1)},
    {id:"c2",name:"Piet (Pieter)",phone:"",whatsapp:"",email:"",company:"",role:"NDNCA pending",project:"Chrome",notes:"",created_by:"claude",updated_at:d(2)}
  ];
  window._notes = [{id:1,item_id:"1",new_value:"Lazarus says the permit office wants the truck list first.",changed_by:"Annemarie",changed_at:d(1),source:"app"},{id:2,item_id:"1",new_value:"Asked Jan for the reference number.",changed_by:"Chris",changed_at:d(2),source:"app"}];
  window._atts = [{id:"a1",target_type:"item",target_id:"1",path:"demo",name:"Permit application scan.pdf",size:234000,uploaded_by:"Annemarie",created_at:d(1)}];
  window._urls = { demo: "#" };
}

async function checkVersion(){
  try {
    const r = await fetch("version.txt?t=" + Date.now(), { cache: "no-store" });
    const v = (await r.text()).trim();
    if (r.ok && v && v !== APP_VERSION) { if ("caches" in window) { const ks = await caches.keys(); await Promise.all(ks.map(k => caches.delete(k))); } location.reload(); }
  } catch(e){}
}
async function load(){
  checkVersion();
  let items;
  if (DEMO) { items = demoItems(); demoExtras(); window._keyStatus = "not set"; window._projects = [{name:"Transport",sort:10,stage:"Qualifying",summary:"Demo project summary.",key_facts:"Rate R350/t\nAdrian R200/t",contacts:"Jan & Lazarus",next_milestone:"Written agreement",updated_at:new Date().toISOString(),updated_by:"claude"}]; }
  else {
    const [r1, r2, r3, r4, r5] = await Promise.all([
      sb.from("items").select("*").neq("state","Done"),
      sb.from("projects").select("*"),
      sb.from("contacts").select("*").order("name"),
      sb.from("events").select("id,item_id,new_value,changed_by,changed_at,source").eq("field","note").order("changed_at", { ascending: false }).limit(400),
      sb.from("attachments").select("*").order("created_at", { ascending: false })
    ]);
    if (r1.error) { $("list").innerHTML = `<div class="empty">Could not load: ${esc(r1.error.message)}</div>`; return; }
    items = r1.data; window._projects = r2.data || []; window._contacts = r3.data || []; window._notes = r4.data || []; window._atts = r5.data || [];
    window._urls = window._urls || {};
    const paths = window._atts.map(a => a.path).filter(p => !window._urls[p]);
    if (paths.length) { try { const { data } = await sb.storage.from("files").createSignedUrls(paths, 3600); for (const u of (data || [])) if (u.signedUrl) window._urls[u.path] = u.signedUrl; } catch(e){} }
    sb.rpc("bot_key_status").then(r => { window._keyStatus = r.data || "unknown"; if (view === "bot") render();
      return sb.from("briefs").select("*").order("created_at", { ascending: false }).limit(1); }).then(r => {
      const b = r && r.data && r.data[0];
      const today = new Date(Date.now() + 2*3600e3).toISOString().slice(0,10);
      window._brief = (b && b.for_date === today) ? b : null;
      if (view === "worklist") render();
      if (!window._brief && window._keyStatus && window._keyStatus !== "not set" && window._keyStatus !== "unknown" && !window._autoBriefed) { window._autoBriefed = true; askBot("", "brief", "", true); }
    });
  }
  for (const it of items) {
    it._days = daysSince(it.last_chased || it.created_at);
    it._stale = it._days >= (it.nudge_after_days || 3);
    it._me = isMe(it);
  }
  window._items = items;
  const names = [...new Set(items.map(i => i.waiting_on).filter(Boolean))].sort();
  $("people").innerHTML = ["Me", ...names.filter(n => !/^me$/i.test(n))].map(n => `<option value="${esc(n)}">`).join("");
  render();
}
// Signed links expire after an hour; refresh them so old links do not go dead while the app stays open.
setInterval(() => { window._urls = {}; if (!DEMO && !$("board").classList.contains("hidden")) load(); }, 50*60*1000);

const byPrioThenAge = (a,b) => (a.priority||2) - (b.priority||2) || b._days - a._days;

function filesHtml(type, id){
  const arr = attsFor(type, id);
  return `<div class="files">${arr.map(a => `<div class="file"><span class="fn">${window._urls[a.path] ? `<a href="${esc(window._urls[a.path])}" target="_blank" rel="noopener">${esc(a.name)}</a>` : esc(a.name)}</span><span class="fm">${fmtSize(a.size)} · ${esc(firstName(a.uploaded_by))} ${new Date(a.created_at).toLocaleDateString("en-ZA", { timeZone: "Africa/Johannesburg", day: "numeric", month: "short" })}</span><button data-rmfile="${a.id}" aria-label="Remove file">Remove</button></div>`).join("") || `<div class="quiet">No files yet.</div>`}
    <div class="acts" style="margin:8px 0 0"><button data-attach="${type}:${esc(String(id))}">Attach file or photo</button></div></div>`;
}
function panelHtml(it){
  const ns = notesFor(it.id);
  return `<div class="npanel"><div class="lbl">Notes</div>
    ${ns.length ? ns.map(n => `<div class="note">${esc(n.new_value)}<div class="nm">${esc(n.changed_by)} · ${fmtWhen(n.changed_at)}</div></div>`).join("") : `<div class="quiet">No notes yet. Anything you write here is seen by both of you.</div>`}
    <div class="nadd"><input placeholder="Add a note…" data-noteinput="${it.id}" maxlength="2000" enterkeyhint="send"><button class="primary" data-note="${it.id}">Save</button></div>
    <div class="lbl">Files</div>${filesHtml("item", it.id)}</div>`;
}

function rowHtml(it, n){
  const stateDot = it.state === "Proposed" ? "d-prop" : (it._stale ? "d-stale" : "d-ok");
  const stateWord = it.state === "Proposed" ? "Proposed" : (it._stale ? "Needs a chase" : "On track");
  const prio = it.priority === 1 ? `<span class="pill"><i class="dot d-high"></i>High</span>` : it.priority === 3 ? `<span class="pill"><i class="dot d-low"></i>Low</span>` : `<span class="pill"><i class="dot" style="background:var(--rail-normal)"></i>Normal</span>`;
  const own = `<span class="pill">${esc(it.owner || "Chris")}${(it.owner || "Chris") === me ? " (me)" : ""}</span>`;
  const other = (it.owner || "Chris") === "Annemarie" ? "Chris" : "Annemarie";
  const nN = notesFor(it.id).length, fN = attsFor("item", it.id).length, open = openPanels.has("item:" + it.id);
  return `<div class="row p${it.priority || 2}" data-id="${it.id}">
    <div class="l1"><i class="dot ${stateDot}" aria-label="${stateWord}" style="margin-top:6px"></i>${n ? `<span class="num">${n}.</span>` : ""}<div class="txt">${esc(it.waiting_for)}</div><div class="days" aria-label="${it._days} days since last chase">${it._days}d</div></div>
    ${it.blocks ? `<div class="l2">Blocks → <b>${esc(it.blocks)}</b></div>` : ""}
    ${it.next_action ? `<div class="l2">Next: ${esc(it.next_action)}</div>` : ""}
    <div class="pills"><span class="pill"><i class="dot ${stateDot}"></i>${stateWord}</span>${prio}${own}<span class="pill">${esc(it.project)}</span></div>
    <div class="acts">
      ${it.state === "Proposed" ? `<button class="primary" data-a="confirm">OK, keep</button><button data-a="drop">Drop</button>` : ""}
      ${it._me ? `<button class="primary" data-a="done">Done ✓</button>` : `<button data-a="chased">Asked today</button><button class="primary" data-a="done">Got it ✓</button>`}
      ${it.priority === 1 ? `<button data-a="priority" data-v="2">Normal</button>` : `<button data-a="priority" data-v="1">High</button>`}
      <button data-a="assign" data-v="${other}">→ ${other}</button>
      <button data-panel="item:${it.id}"${open ? ' style="background:var(--tab-on)"' : ""}>Notes${nN ? " " + nN : ""}${fN ? " · Files " + fN : ""}</button>
      <button data-botitem="${it.id}">Bot</button>
      ${it.state !== "Proposed" ? `<button data-a="drop">Drop</button>` : ""}
    </div>${open ? panelHtml(it) : ""}</div>`;
}

function contactFormHtml(c){
  const f = (k, lbl, type) => `<div class="lbl">${lbl}</div><input class="c-${k}" type="${type || "text"}" value="${esc(c[k] || "")}" autocomplete="off">`;
  return `<div class="cform" data-cform="${c.id || "new"}">${f("name", "Name")}${f("phone", "Phone (e.g. 078 219 5810)", "tel")}${f("whatsapp", "WhatsApp number only if different (27…)", "tel")}${f("email", "Email", "email")}
    <div class="two"><div>${f("company", "Company")}</div><div>${f("role", "Role")}</div></div>
    <div class="lbl">Project</div><select class="c-project"><option value="">—</option>${PROJECTS.map(p => `<option${c.project === p ? " selected" : ""}>${p}</option>`).join("")}</select>
    <div class="lbl">Notes</div><textarea class="c-notes">${esc(c.notes || "")}</textarea>
    <div class="acts" style="margin:10px 0 0"><button class="primary" data-csave="${c.id || "new"}">Save contact</button><button data-ccancel="${c.id || "new"}">Cancel</button></div><div class="msg c-msg"></div></div>`;
}
function contactHtml(c){
  const open = openPanels.has("contact:" + c.id), edit = editContact === c.id;
  const wa = c.whatsapp || toWa(c.phone);
  const fN = attsFor("contact", c.id).length;
  const sub = [c.company, c.role].filter(Boolean).join(" · ");
  return `<div class="ccard" data-cid="${c.id}"><div class="t"><div class="n">${esc(c.name)}</div>${c.phone ? `<button data-call="${esc(c.phone)}">Call</button>` : ""}${wa ? `<button data-wa1="${esc(wa)}">WhatsApp</button>` : ""}</div>
    <div class="s">${esc(sub) || "No company or role yet"}${c.project ? ` · ${esc(c.project)}` : ""}</div>
    <div class="k">${c.phone ? esc(c.phone) + (c.whatsapp && c.whatsapp !== toWa(c.phone) ? ` · WhatsApp +${esc(c.whatsapp)}` : "") : (c.whatsapp ? `WhatsApp +${esc(c.whatsapp)}` : "No number saved yet")}${c.email ? `\n${esc(c.email)}` : ""}</div>
    ${c.notes ? `<div class="k">${esc(c.notes)}</div>` : ""}
    <div class="acts" style="margin:9px 0 0"><button data-panel="contact:${c.id}"${open ? ' style="background:var(--tab-on)"' : ""}>Files${fN ? " " + fN : ""}</button><button data-cedit="${c.id}"${edit ? ' style="background:var(--tab-on)"' : ""}>Edit</button><button data-botcontact="${esc(c.name)}">Bot</button></div>
    ${open ? `<div class="npanel" style="margin-left:0"><div class="lbl">Files</div>${filesHtml("contact", c.id)}</div>` : ""}
    ${edit ? contactFormHtml(c) : ""}
    <div class="s" style="margin-top:8px;font-size:13px">Saved by ${esc(c.created_by || "")}${c.updated_at ? " · updated " + fmtWhen(c.updated_at) : ""}</div></div>`;
}

function render(){
  const items = window._items || [];
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.v === view));
  const stale = items.filter(i => i._stale && !i._me).length, proposed = items.filter(i => i.state === "Proposed").length, mine = items.filter(i => i._me).length, assigned = items.filter(i => (i.owner || "Chris") === me).length;
  $("strip").innerHTML = `<span>${items.length} open</span><span><i class="dot d-stale"></i>${stale} to chase</span><span><i class="dot d-prop"></i>${proposed} to confirm</span><span>${mine} to-do</span><span>${assigned} on ${me || "me"}</span>`;
  if (!items.length && view !== "people" && view !== "bot") { $("list").innerHTML = `<div class="empty">Nothing open. Tap + Add.</div>`; return; }
  let html = "";
  if (view === "people") {
    const groups = {};
    for (const it of items) if (!it._me) (groups[it.waiting_on || "Unknown"] ||= []).push(it);
    const order = Object.entries(groups).sort((a,b) => Math.min(...a[1].map(i=>i.priority||2)) - Math.min(...b[1].map(i=>i.priority||2)) || Math.max(...b[1].map(i=>i._days)) - Math.max(...a[1].map(i=>i._days)));
    for (const [name, arr] of order) {
      arr.sort(byPrioThenAge);
      const oldest = Math.max(...arr.map(i => i._days));
      const anyStale = arr.some(i => i._stale);
      html += `<div class="card"><div class="card-h"><i class="dot ${anyStale ? "d-stale" : "d-ok"}"></i><div class="name">${esc(name)}<span class="sub">${arr.length} open · oldest ${oldest}d</span></div><button data-botperson="${esc(name)}">Bot</button><button data-wa="${esc(name)}">WhatsApp list</button></div>`;
      const cs = contactsFor(name).filter(c => c.phone || c.whatsapp);
      html += cs.length ? `<div class="cstrip">${cs.map(c => `<span>${esc(firstName(c.name))} ${esc(c.phone || "+" + c.whatsapp)}</span>${c.phone ? `<button data-call="${esc(c.phone)}">Call</button>` : ""}<button data-wa1="${esc(c.whatsapp || toWa(c.phone))}">WhatsApp</button>`).join("")}</div>`
                       : `<div class="cstrip"><span>No number saved</span><button data-cnew="${esc(firstName(name))}">Add contact</button></div>`;
      arr.forEach((it, i) => html += rowHtml(it, i+1));
      html += `</div>`;
    }
    if (!order.length) html = `<div class="empty">Nothing waiting on anyone.</div>`;
    const contacts = window._contacts || [];
    html += `<div class="h2row" id="contactsHead"><h2>Contacts — ${contacts.length}</h2><button data-cnew="">+ Contact</button></div>`;
    if (newContact) html += `<div class="ccard">${contactFormHtml(newContact)}</div>`;
    contacts.forEach(c => html += contactHtml(c));
    if (!contacts.length) html += `<div class="quiet">No contacts saved yet. Tap + Contact, or tell the bot someone's number.</div>`;
  } else if (view === "worklist") {
    const target = who || me || "Chris";
    const list = items.filter(i => who === "All" || (i.owner || "Chris") === target).sort(byPrioThenAge);
    const chips = ["Mine", "Annemarie", "Chris", "All"].filter(c => c !== me).map(c => `<button data-who="${c === "Mine" ? "" : c}" class="${(c === "Mine" && !who) || who === c ? "on" : ""}">${c}</button>`).join("");
    const br = window._brief;
    const todayStr = new Date().toLocaleDateString("en-ZA", { timeZone: "Africa/Johannesburg", day: "numeric", month: "short" });
    html += `<div class="brief"><div class="t"><div class="n">Today's brief</div><button data-bot="brief-here">${botBusy ? "Working…" : br ? "Refresh" : "Get brief"}</button></div>
      ${br ? `<div class="b">${esc(br.text)}</div><div class="s">${new Date(br.created_at).toLocaleString("en-ZA", { timeZone: "Africa/Johannesburg", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })} · for ${esc(br.actor)}</div>` : `<div class="s">No brief yet for ${todayStr}. Tap Get brief.</div>`}</div>`;
    html += `<div class="chips">${chips}</div>`;
    const bands = [[1,"High priority"],[2,"Normal"],[3,"Low"]];
    let n = 0;
    for (const [pr, label] of bands) {
      const arr = list.filter(i => (i.priority || 2) === pr);
      if (!arr.length) continue;
      html += `<h2>${label} — ${arr.length}</h2><div class="card">`;
      arr.forEach(it => html += rowHtml(it, ++n).replace('<div class="txt">', it._me ? '<div class="txt">' : `<div class="txt"><span style="color:var(--muted)">${esc(it.waiting_on)}:</span> `));
      html += `</div>`;
    }
    if (!list.length) html += `<div class="empty">Nothing on ${who === "All" ? "anyone" : (who || "you")}. Tap + Add.</div>`;
  } else if (view === "bot") {
    html += `<div class="chat">${chat.length ? chat.map((m, i) => m.role === "sugg" ? `<div class="sugg" data-si="${i}">Suggested for ${esc(m.s.project)} · ${esc(m.s.field)} (${esc(m.s.mode)}):\n${esc(m.s.text)}<div class="acts"><button class="primary" data-apply="${i}">Apply</button><button data-dismiss="${i}">Dismiss</button></div></div>` : `<div class="bub ${m.role === "user" ? "u" : m.role === "sys" ? "s" : "a"}">${esc(m.text)}</div>`).join("") : `<div class="bub s">Ask anything about the board, give it news or someone's number, or tap Daily brief. The bot only proposes — you confirm.</div>`}${botBusy ? `<div class="bub s">Thinking…</div>` : ""}</div>
      <div class="ask"><textarea id="q" placeholder="e.g. What should I chase first today? Save Piet's number 082 123 4567. Draft a message to Adrian."></textarea><button class="primary" data-bot="ask">Ask</button></div>
      <div class="acts" style="margin:10px 0 0"><button data-bot="brief">Daily brief</button><button data-bot="clear">Clear</button></div>
      <details class="keybox"${window._keyStatus === "not set" ? " open" : ""}><summary>Bot key: ${esc(window._keyStatus || "…")} — tap to set or change</summary>
        <input id="botKey" type="password" placeholder="Paste your Anthropic API key (starts with sk-ant-)" autocomplete="off">
        <div class="acts" style="margin:8px 0 0"><button class="primary" data-bot="savekey">Save key</button></div>
        <div class="msg" id="keyMsg">The key is stored encrypted in the database. Only the bot can read it. Nobody, including Claude in chat, sees it.</div></details>`;
  } else {
    const byProj = {};
    for (const it of items) (byProj[it.project] ||= []).push(it);
    const pinfo = window._projects || [];
    const names = [...new Set([...pinfo.map(p => p.name), ...Object.keys(byProj)])];
    names.sort((a,b) => ((pinfo.find(p => p.name === a) || {sort:999}).sort) - ((pinfo.find(p => p.name === b) || {sort:999}).sort) || a.localeCompare(b));
    for (const proj of names) {
      const arr = (byProj[proj] || []).sort(byPrioThenAge);
      const p = pinfo.find(x => x.name === proj) || {name: proj, summary:"", stage:"", key_facts:"", contacts:"", next_milestone:""};
      const fN = attsFor("project", proj).length, open = openPanels.has("project:" + proj);
      html += `<div class="pinfo" data-p="${esc(proj)}"><div class="t"><div class="n">${esc(proj)}</div><button data-botproj="${esc(proj)}">Bot</button><button data-edit="${esc(proj)}">Edit info</button></div>
        <div class="s">${esc(p.stage) || "Stage not set"}</div>
        <div class="view">${p.summary ? `<div class="k">${esc(p.summary)}</div>` : ""}
        ${p.key_facts ? `<div class="lbl">Key facts</div><div class="k">${esc(p.key_facts)}</div>` : ""}
        ${p.contacts ? `<div class="lbl">Contacts</div><div class="k">${esc(p.contacts)}</div>` : ""}
        ${p.next_milestone ? `<div class="lbl">Next milestone</div><div class="k">${esc(p.next_milestone)}</div>` : ""}
        <div class="acts" style="margin:10px 0 0"><button data-panel="project:${esc(proj)}"${open ? ' style="background:var(--tab-on)"' : ""}>Files${fN ? " " + fN : ""}</button></div>
        ${open ? `<div class="npanel" style="margin-left:0"><div class="lbl">Files</div>${filesHtml("project", proj)}</div>` : ""}
        ${p.updated_at ? `<div class="s" style="margin-top:8px">Info updated ${new Date(p.updated_at).toLocaleDateString()} by ${esc(p.updated_by || "")}</div>` : ""}</div>
        <div class="edit hidden"><div class="lbl">Stage</div><input class="e-stage" value="${esc(p.stage)}">
        <div class="lbl">Summary</div><textarea class="e-summary">${esc(p.summary)}</textarea>
        <div class="lbl">Key facts (one per line)</div><textarea class="e-facts" style="min-height:140px">${esc(p.key_facts)}</textarea>
        <div class="lbl">Contacts (one per line)</div><textarea class="e-contacts">${esc(p.contacts)}</textarea>
        <div class="lbl">Next milestone</div><input class="e-next" value="${esc(p.next_milestone)}">
        <div class="acts" style="margin-left:0"><button class="primary" data-save="${esc(proj)}">Save</button><button data-cancel="${esc(proj)}">Cancel</button></div></div></div>`;
      if (!arr.length) continue;
      html += `<h2>${esc(proj)} — ${arr.length} open</h2><div class="card">`;
      arr.forEach(it => html += rowHtml(it, 0).replace('<div class="txt">', `<div class="txt"><span style="color:var(--muted)">${esc(it.waiting_on)}:</span> `));
      html += `</div>`;
    }
  }
  $("list").innerHTML = html;
  $("foot").textContent = (me ? me + " · " : "") + "Updated " + new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}) + " · app v" + APP_VERSION;
}

document.querySelector(".tabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-v]"); if (!b) return;
  view = b.dataset.v; try{ localStorage.setItem("view", view) }catch(e){} render();
});

$("list").addEventListener("click", async e => {
  const wa = e.target.closest("button[data-wa]");
  if (wa) {
    const name = wa.dataset.wa;
    const asks = (window._items || []).filter(i => i.waiting_on === name).sort(byPrioThenAge);
    const cs = contactsFor(name).filter(c => c.whatsapp || c.phone);
    const num = cs.length === 1 ? (cs[0].whatsapp || toWa(cs[0].phone)) : "";
    const text = `Hi ${firstName(name)}, quick check-in on a few things:\n` + asks.map((a, i) => `${i+1}. ${a.waiting_for}`).join("\n") + `\nAny update? Thanks.`;
    location.href = `https://wa.me/${num}?text=` + encodeURIComponent(text);
    return;
  }
  const b = e.target.closest("button[data-a]"); if (!b) return;
  const row = b.closest(".row"); const id = row.dataset.id;
  if (DEMO) { alert("Demo mode — nothing saved"); return; }
  row.querySelectorAll("button").forEach(x => x.disabled = true); b.textContent = "…";
  const { error } = await sb.rpc("item_action", { p_id: id, p_action: b.dataset.a, p_value: b.dataset.v || null });
  if (error) { b.textContent = "Failed"; console.error(error); row.querySelectorAll("button").forEach(x => x.disabled = false); return; }
  load();
});

// Notes, files and contacts
$("list").addEventListener("click", async e => {
  const pn = e.target.closest("button[data-panel]");
  if (pn) { const k = pn.dataset.panel; openPanels.has(k) ? openPanels.delete(k) : openPanels.add(k); render(); return; }
  const cl = e.target.closest("button[data-call]");
  if (cl) { location.href = "tel:" + cl.dataset.call.replace(/[^\d+]/g, ""); return; }
  const w1 = e.target.closest("button[data-wa1]");
  if (w1) { location.href = "https://wa.me/" + w1.dataset.wa1; return; }
  const nb = e.target.closest("button[data-note]");
  if (nb) {
    const inp = document.querySelector(`input[data-noteinput="${nb.dataset.note}"]`); const text = ((inp && inp.value) || "").trim(); if (!text) { inp && inp.focus(); return; }
    if (DEMO) { alert("Demo mode — nothing saved"); return; }
    nb.disabled = true; nb.textContent = "…";
    const { error } = await sb.from("events").insert({ item_id: nb.dataset.note, field: "note", new_value: text, source: "app" });
    if (error) { nb.textContent = "Failed"; toast("Could not save note: " + error.message, 5000); nb.disabled = false; return; }
    load(); return;
  }
  const at = e.target.closest("button[data-attach]");
  if (at) { const [type, ...rest] = at.dataset.attach.split(":"); pendingAttach = { type, id: rest.join(":") }; $("fileInput").value = ""; $("fileInput").click(); return; }
  const rf = e.target.closest("button[data-rmfile]");
  if (rf) {
    const a = (window._atts || []).find(x => x.id === rf.dataset.rmfile); if (!a) return;
    if (!confirm(`Remove "${a.name}" for everyone?`)) return;
    if (DEMO) { alert("Demo mode — nothing saved"); return; }
    rf.disabled = true; rf.textContent = "…";
    await sb.storage.from("files").remove([a.path]);
    const { error } = await sb.from("attachments").delete().eq("id", a.id);
    if (error) toast("Could not remove: " + error.message, 5000);
    load(); return;
  }
  const cn = e.target.closest("button[data-cnew]");
  if (cn) { newContact = newContact && !cn.dataset.cnew ? null : { name: cn.dataset.cnew || "" }; editContact = null; render();
    const h = $("contactsHead"); if (h && newContact) h.scrollIntoView({ block: "start" }); const f = document.querySelector(".cform input.c-name"); if (f && newContact && !f.value) f.focus(); return; }
  const ce = e.target.closest("button[data-cedit]");
  if (ce) { editContact = editContact === ce.dataset.cedit ? null : ce.dataset.cedit; render(); return; }
  const cc = e.target.closest("button[data-ccancel]");
  if (cc) { if (cc.dataset.ccancel === "new") newContact = null; else editContact = null; render(); return; }
  const cs = e.target.closest("button[data-csave]");
  if (cs) {
    const form = cs.closest(".cform"); const v = k => (form.querySelector(".c-" + k).value || "").trim();
    const row = { name: v("name"), phone: v("phone"), whatsapp: v("whatsapp").replace(/\D/g, "") || toWa(v("phone")), email: v("email"), company: v("company"), role: v("role"), project: v("project"), notes: v("notes") };
    if (!row.name) { form.querySelector(".c-msg").textContent = "A name is needed."; return; }
    if (DEMO) { form.querySelector(".c-msg").textContent = "Demo mode — nothing saved"; return; }
    cs.disabled = true; cs.textContent = "…";
    const { error } = cs.dataset.csave === "new" ? await sb.from("contacts").insert(row) : await sb.from("contacts").update(row).eq("id", cs.dataset.csave);
    if (error) { form.querySelector(".c-msg").textContent = "Failed: " + error.message; cs.disabled = false; cs.textContent = "Save contact"; return; }
    newContact = null; editContact = null; toast("Contact saved."); load(); return;
  }
  const bc = e.target.closest("button[data-botcontact]");
  if (bc) { askBot(`About ${bc.dataset.botcontact}: what is open with them, what do we know, what is missing from their contact card, and what should we ask them next?`, "ask"); return; }
});
$("list").addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const inp = e.target.closest("input[data-noteinput]"); if (!inp) return;
  e.preventDefault(); const btn = document.querySelector(`button[data-note="${inp.dataset.noteinput}"]`); if (btn) btn.click();
});
$("fileInput").addEventListener("change", async () => {
  const f = $("fileInput").files && $("fileInput").files[0]; const t = pendingAttach; pendingAttach = null;
  if (!f || !t) return;
  if (f.size > 25 * 1024 * 1024) { toast("That file is over 25 MB. Send a smaller one.", 5000); return; }
  if (DEMO) { alert("Demo mode — nothing saved"); return; }
  toast("Uploading " + f.name + "…", 0);
  const safe = f.name.replace(/[^\w.\-]+/g, "_").slice(-80);
  const path = `${t.type}/${t.id}/${Date.now()}-${safe}`;
  const up = await sb.storage.from("files").upload(path, f, { contentType: f.type || "application/octet-stream", upsert: false });
  if (up.error) { toast("Upload failed: " + up.error.message, 6000); return; }
  const { error } = await sb.from("attachments").insert({ target_type: t.type, target_id: String(t.id), path, name: f.name, size: f.size, mime: f.type || "" });
  if (error) { toast("Uploaded, but could not record it: " + error.message, 6000); return; }
  openPanels.add(`${t.type}:${t.id}`);
  toast("Saved " + f.name); load();
});

$("list").addEventListener("click", async e => {
  const ed = e.target.closest("button[data-edit]"), cx = e.target.closest("button[data-cancel]"), sv = e.target.closest("button[data-save]");
  if (!ed && !cx && !sv) return;
  const box = e.target.closest(".pinfo");
  if (ed || cx) { box.querySelector(".view").classList.toggle("hidden", !!ed); box.querySelector(".edit").classList.toggle("hidden", !ed); return; }
  if (DEMO) { alert("Demo mode — nothing saved"); return; }
  sv.disabled = true; sv.textContent = "…";
  const { error } = await sb.rpc("set_project", { p_name: sv.dataset.save, p_summary: box.querySelector(".e-summary").value, p_stage: box.querySelector(".e-stage").value, p_key_facts: box.querySelector(".e-facts").value, p_contacts: box.querySelector(".e-contacts").value, p_next_milestone: box.querySelector(".e-next").value });
  if (error) { sv.textContent = "Failed"; console.error(error); sv.disabled = false; return; }
  load();
});

$("list").addEventListener("click", e => {
  const c = e.target.closest("button[data-who]"); if (!c) return;
  who = c.dataset.who; try{ localStorage.setItem("who", who) }catch(e){} render();
});

async function askBot(question, mode, focus, silent){
  if (botBusy) return;
  if (question) chat.push({ role: "user", text: question });
  botBusy = true; if (!silent) { view = "bot"; try{ localStorage.setItem("view", view) }catch(e){} } render();
  try {
    if (DEMO) throw new Error("Demo mode — the bot needs a real login.");
    const history = chat.filter(m => m.role !== "sys").slice(-12, -1).map(m => ({ role: m.role === "user" ? "user" : "assistant", content: m.text }));
    const { data, error } = await sb.functions.invoke("ask", { body: { question: question || "", mode, history, focus: focus || "" } });
    if (error) { let msg = error.message || String(error); try { const j = await error.context.json(); if (j && j.error) msg = j.error; } catch(e){} throw new Error(msg); }
    chat.push({ role: "assistant", text: data.answer || "(no answer)" });
    if (data.actions && data.actions.length) chat.push({ role: "sys", text: data.actions.join("\n") });
    for (const s of (data.suggestions || [])) chat.push({ role: "sugg", s, text: "" });
    if (mode === "brief") window._brief = { text: data.answer || "", created_at: new Date().toISOString(), actor: me, for_date: "" };
    botBusy = false; render();
    if (data.reload || mode === "brief" || (data.actions || []).length) load(); else if (view === "bot") { window.scrollTo(0, document.body.scrollHeight); }
  } catch (err) {
    botBusy = false; chat.push({ role: "sys", text: "Bot error: " + (err.message || err) }); render();
  }
}
$("list").addEventListener("click", async e => {
  const bi = e.target.closest("button[data-botitem]"), bp = e.target.closest("button[data-botperson]"), bj = e.target.closest("button[data-botproj]");
  const ap = e.target.closest("button[data-apply]"), dm = e.target.closest("button[data-dismiss]");
  if (bi) { const it = (window._items || []).find(x => x.id === bi.dataset.botitem); if (!it) return;
    askBot(`About "${it.waiting_for}" (waiting on ${it.waiting_on}, ${it._days} days): what should I do next, what exactly do I ask, and draft the WhatsApp message. Set the next step if it is missing.`, "ask", it.id); return; }
  if (bp) { askBot(`Prep my chase with ${bp.dataset.botperson}: everything open with them in priority order, what to ask, what not to give away, and one WhatsApp message covering it all.`, "ask"); return; }
  if (bj) { askBot(`Review the ${bj.dataset.botproj} project: what is missing or contradictory, the top risks, the next 3 moves, and suggest any project-info updates.`, "ask"); return; }
  if (dm) { chat.splice(Number(dm.dataset.dismiss), 1); render(); return; }
  if (ap) {
    const m = chat[Number(ap.dataset.apply)]; if (!m || !m.s) return;
    const p = (window._projects || []).find(x => x.name === m.s.project) || { name: m.s.project, summary:"", stage:"", key_facts:"", contacts:"", next_milestone:"" };
    const cur = p[m.s.field] || "";
    const next = (m.s.mode === "append" && (m.s.field === "key_facts" || m.s.field === "contacts")) ? (cur ? cur + "\n" + m.s.text : m.s.text) : m.s.text;
    const body = { p_name: p.name, p_summary: p.summary || "", p_stage: p.stage || "", p_key_facts: p.key_facts || "", p_contacts: p.contacts || "", p_next_milestone: p.next_milestone || "" };
    body["p_" + m.s.field] = next;
    ap.disabled = true; ap.textContent = "…";
    const { error } = await sb.rpc("set_project", body);
    if (error) { ap.textContent = "Failed"; return; }
    chat.splice(Number(ap.dataset.apply), 1, { role: "sys", text: `Applied to ${p.name} · ${m.s.field}.` }); render(); load(); return;
  }
});
$("botFab").onclick = () => { view = "bot"; try{ localStorage.setItem("view", view) }catch(e){} render(); window.scrollTo(0, document.body.scrollHeight); };
$("list").addEventListener("click", e => {
  const b = e.target.closest("button[data-bot]"); if (!b) return;
  if (b.dataset.bot === "brief-here") { askBot("", "brief", "", true); return; }
  if (b.dataset.bot === "clear") { chat = []; render(); return; }
  if (b.dataset.bot === "savekey") {
    const k = ($("botKey").value || "").trim(); if (!/^sk-ant-/.test(k) || k.length < 40) { $("keyMsg").textContent = "That is not an API key. It must start with sk-ant- (the workspace ID starting wrkspc_ will not work)."; return; }
    if (DEMO) { $("keyMsg").textContent = "Demo mode — nothing saved"; return; }
    b.disabled = true; b.textContent = "…";
    sb.rpc("set_bot_key", { p_key: k }).then(({ error }) => {
      if (error) { $("keyMsg").textContent = "Failed: " + error.message; b.disabled = false; b.textContent = "Save key"; return; }
      $("botKey").value = ""; window._keyStatus = "set just now"; chat.push({ role: "sys", text: "Key saved. Try Daily brief." }); render();
    });
    return;
  }
  if (b.dataset.bot === "brief") { askBot("", "brief"); return; }
  const q = ($("q") && $("q").value.trim()) || ""; if (!q) return; askBot(q, "ask");
});

$("addBtn").onclick = () => { $("addForm").classList.toggle("hidden"); $("addBtn").textContent = $("addForm").classList.contains("hidden") ? "+ Add" : "Close"; if (!$("addForm").classList.contains("hidden")) $("fFor").focus(); };
$("addForm").onsubmit = async e => {
  e.preventDefault();
  if (DEMO) { $("addMsg").textContent = "Demo mode — nothing saved"; return; }
  const { error } = await sb.rpc("add_item", { p_project: $("fProject").value, p_waiting_on: $("fOn").value.trim(), p_waiting_for: $("fFor").value.trim(), p_blocks: $("fBlocks").value.trim(), p_next: $("fNext").value.trim(), p_priority: Number($("fPrio").value), p_owner: $("fOwner").value });
  if (error) { $("addMsg").textContent = "Failed: " + error.message; return; }
  e.target.reset(); $("addMsg").textContent = ""; $("addBtn").click(); load();
};
$("refreshBtn").onclick = () => location.reload();
$("outBtn").onclick = async () => { await sb.auth.signOut(); me = ""; show(); };

$("loginForm").onsubmit = async e => {
  e.preventDefault();
  $("loginMsg").textContent = "Signing in…";
  const { error } = await sb.auth.signInWithPassword({ email: $("email").value.trim(), password: $("pw").value });
  if (error) { $("loginMsg").textContent = /confirm/i.test(error.message) ? "Login not activated yet. Open the confirm link in your email, or tell Claude “activate my login”." : error.message; return; }
  show();
};
$("signupBtn").onclick = async () => {
  if ($("pw").value.length < 8) { $("loginMsg").textContent = "Pick a password of at least 8 characters first."; return; }
  const { error } = await sb.auth.signUp({ email: $("email").value.trim(), password: $("pw").value });
  $("loginMsg").textContent = error ? error.message : "Login created. Open the confirm link in your email, or tell Claude “activate my login”. Then tap Sign in.";
};

async function show(){
  let signedIn = DEMO;
  if (!DEMO) {
    const { data } = await sb.auth.getSession(); signedIn = !!data.session;
    if (signedIn) {
      const em = data.session.user.email || "";
      me = /annemarie/i.test(em) ? "Annemarie" : /cavereef/i.test(em) ? "Chris" : em;
      $("fOwner").value = me === "Annemarie" ? "Annemarie" : "Chris";
    }
  } else me = "Chris";
  $("login").classList.toggle("hidden", signedIn);
  $("board").classList.toggle("hidden", !signedIn);
  $("addBtn").classList.toggle("hidden", !signedIn);
  $("refreshBtn").classList.toggle("hidden", !signedIn);
  $("outBtn").classList.toggle("hidden", !signedIn);
  $("botFab").classList.toggle("hidden", !signedIn);
  if (signedIn) load();
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && !$("board").classList.contains("hidden")) load(); });
show();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
