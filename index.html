<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deal Board</title>
<meta name="theme-color" content="#18191C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#1C1C1E; --card:#27272A; --card2:#303034; --line:#3A3A3E; --text:#E4E4E4; --muted:#A3A3A8;
  --btn:#36363B; --btn-text:#E4E4E4; --tab:#2C2C30; --tab-on:#4A4A52;
  --dot-ok:#4FA88A; --dot-stale:#D9A03F; --dot-prop:#8A8A92; --dot-high:#C45C5C; --dot-low:#6B6B72; --rail-normal:#5C7FB8;
}
:root[data-theme="light"]{
  --bg:#F4F1EA; --card:#FFFFFF; --card2:#F7F4EE; --line:#DAD5C9; --text:#1F1F1F; --muted:#5C5C60;
  --btn:#E9E4D8; --btn-text:#1F1F1F; --tab:#E9E4D8; --tab-on:#CFC8B8;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:400 17px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;padding:0 14px 100px;max-width:680px;margin:0 auto}
button{font:inherit;color:var(--btn-text);background:var(--btn);border:0;border-radius:10px;padding:10px 12px;min-height:42px}
button:disabled{opacity:.5}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 0 8px}
h1{font-size:21px;font-weight:500;margin:0}
.hdr-btns{display:flex;gap:8px}
.hdr-btns button{padding:8px 12px;min-height:38px;font-size:15px}
.tabs{display:flex;gap:6px;margin:6px 0 12px}
.tabs button{flex:1;background:var(--tab);padding:10px 6px;font-size:15px}
.tabs button.on{background:var(--tab-on);font-weight:500}
.strip{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:15px;margin:0 2px 12px}
.strip span{display:inline-flex;align-items:center;gap:6px}
.dot{width:13px;height:13px;border-radius:50%;flex:none;display:inline-block}
.d-ok{background:var(--dot-ok)} .d-stale{background:var(--dot-stale)} .d-prop{background:var(--dot-prop)} .d-high{background:var(--dot-high)} .d-low{background:var(--dot-low)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.card-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.card-h .name{flex:1;font-size:19px;font-weight:500}
.card-h .sub{color:var(--muted);font-size:14px;font-weight:400;display:block}
.card-h button{padding:8px 12px;min-height:38px;font-size:14px}
.cstrip{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid var(--line);color:var(--muted);font-size:14px}
.cstrip button{padding:6px 10px;min-height:34px;font-size:13px;background:var(--card2);border:1px solid var(--line)}
.row{padding:11px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row{border-left:6px solid transparent}
.row.p1{border-left-color:var(--dot-high)} .row.p2{border-left-color:var(--rail-normal)} .row.p3{border-left-color:var(--dot-low)}
.pinfo,.ccard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.pinfo .t,.ccard .t{display:flex;align-items:center;gap:10px}
.pinfo .t .n{flex:1;font-size:19px;font-weight:500}
.ccard .t .n{flex:1;font-size:18px;font-weight:500}
.pinfo .t button,.ccard .t button{padding:7px 11px;min-height:36px;font-size:14px}
.pinfo .s,.ccard .s{color:var(--muted);font-size:15px;margin-top:4px}
.pinfo .k,.ccard .k{margin-top:8px;font-size:15px;white-space:pre-wrap}
.ccard .k{margin-top:5px}
.lbl{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.8px;margin-top:10px}
.pinfo textarea,.ccard textarea,.sec-b textarea{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:15px;min-height:70px;margin-top:4px}
.pinfo input,.ccard input,.ccard select{font-size:15px;padding:10px;margin-top:4px}
.row .l1{display:flex;align-items:flex-start;gap:9px}
.row .num{color:var(--muted);min-width:20px;font-size:15px;padding-top:2px}
.row .txt{flex:1}
.row .days{font-size:17px;font-weight:500;min-width:36px;text-align:right;padding-top:1px}
.row .l2{color:var(--muted);font-size:14px;margin:3px 0 0 29px}
.row .l2 b{font-weight:500;color:var(--text)}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 0 29px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:3px 9px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0 0 29px}
.acts button,.acts select{padding:7px 11px;min-height:36px;font-size:14px;background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:10px;width:auto;max-width:100%}
.acts button.primary{background:var(--btn)}
.npanel{margin:9px 0 0 29px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px 12px 12px}
.npanel .lbl:first-child{margin-top:2px}
.npanel .acts button{background:var(--btn)}
.note{padding:7px 0;border-bottom:1px solid var(--line);font-size:15px;white-space:pre-wrap}
.note:last-of-type{border-bottom:0}
.note .nm{color:var(--muted);font-size:13px;margin-top:2px}
.nadd{display:flex;gap:6px;margin-top:8px}
.nadd input{flex:1;font-size:15px;padding:10px;min-width:0}
.nadd button{min-height:42px;flex:none}
.file{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}
.file:last-of-type{border-bottom:0}
.file .fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .fn a{color:var(--text);text-decoration:underline;text-underline-offset:3px}
.file .fm{color:var(--muted);font-size:13px;flex:none}
.file button{padding:5px 9px;min-height:32px;font-size:13px;flex:none}
.quiet{color:var(--muted);font-size:14px;padding:4px 0}
.h2row{display:flex;align-items:center;gap:10px;margin:18px 2px 8px}
.h2row h2{flex:1;margin:0}
.h2row button{padding:6px 11px;min-height:34px;font-size:14px}
h2{font-size:14px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:18px 2px 8px}
.empty{color:var(--muted);padding:30px 0;text-align:center}
form.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0 16px}
label{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}
input,select{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;font-size:17px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wide{margin-top:14px;width:100%;padding:14px;font-weight:500;border:1px solid var(--line)}
.msg{color:var(--muted);font-size:15px;margin-top:10px;min-height:20px}
.fab{position:fixed;right:14px;bottom:18px;border-radius:28px;padding:14px 20px;font-weight:500;border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.3)}
.chips{display:flex;gap:6px;margin:0 0 10px;flex-wrap:wrap}
.chips button{padding:7px 12px;min-height:36px;font-size:14px;background:var(--tab)}
.chips button.on{background:var(--tab-on);font-weight:500}
.chat{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.bub{max-width:92%;padding:10px 13px;border-radius:14px;white-space:pre-wrap;font-size:16px;line-height:1.4}
.bub.u{align-self:flex-end;background:var(--tab-on)}
.bub.a{align-self:flex-start;background:var(--card);border:1px solid var(--line)}
.bub.s{align-self:center;background:transparent;color:var(--muted);font-size:14px}
.ask{display:flex;gap:8px;align-items:flex-end}
.ask textarea{flex:1;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:11px;font:inherit;font-size:16px;min-height:48px;max-height:140px;resize:vertical}
.ask button{min-height:48px}
.keybox{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--muted);font-size:14px}
.keybox summary{cursor:pointer;min-height:36px;display:flex;align-items:center}
.keybox input{margin-top:8px;font-size:15px}
.brief{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.brief .t{display:flex;align-items:center;gap:10px}
.brief .t .n{flex:1;font-size:16px;font-weight:500}
.brief .t button{padding:7px 11px;min-height:36px;font-size:14px}
.brief .b{white-space:pre-wrap;font-size:15px;margin-top:8px;line-height:1.45}
.brief .s{color:var(--muted);font-size:13px;margin-top:6px}
.sugg{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px;align-self:stretch;white-space:pre-wrap}
.sugg .acts{margin:8px 0 0}
.fab2{position:fixed;left:14px;bottom:18px;border-radius:28px;padding:14px 20px;font-weight:500;border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.3)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:15px;box-shadow:0 4px 14px rgba(0,0,0,.3);max-width:90vw;z-index:5}
/* Deals */
.deal{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.deal-h{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;cursor:pointer;min-height:56px}
.deal-h .dot{margin-top:6px}
.dh{flex:1;min-width:0}
.dn{font-size:18px;font-weight:500;line-height:1.3}
.ds{color:var(--muted);font-size:14px;margin-top:2px}
.dx{color:var(--muted);font-size:14px;margin-top:5px}
.bar{height:7px;background:var(--card2);border:1px solid var(--line);border-radius:4px;margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--dot-ok)}
.chev{color:var(--muted);font-size:16px;padding-top:2px;flex:none;width:18px;text-align:center}
.deal-b{border-top:1px solid var(--line)}
.deal-b .pinfo{border:0;border-top:1px solid var(--line);border-radius:0;margin:0}
.sec{border-bottom:1px solid var(--line)}
.sec:last-of-type{border-bottom:0}
.sec-h{display:flex;align-items:center;gap:8px;padding:10px 14px;cursor:pointer;min-height:46px;background:var(--card2)}
.sec-h .st{flex:1;font-size:15px;font-weight:500}
.cnt{color:var(--muted);font-size:14px}
.sec-b{padding:6px 14px 12px}
.sec-b input,.sec-b select{font-size:15px;padding:10px;margin-top:4px}
.stg{border-bottom:1px solid var(--line)}
.stg-h{display:flex;align-items:center;gap:9px;padding:9px 0;cursor:pointer;min-height:44px}
.stg-h .st{flex:1;font-size:15px}
.sbox{width:14px;height:14px;border-radius:4px;border:2px solid var(--muted);flex:none}
.sbox.part{border-color:var(--dot-ok);background:linear-gradient(90deg,var(--dot-ok) 50%,transparent 50%)}
.sbox.full{border-color:var(--dot-ok);background:var(--dot-ok)}
.step-r{display:flex;align-items:flex-start;gap:10px;padding:8px 0 8px 4px;cursor:pointer;min-height:42px}
.cbox{width:22px;height:22px;border-radius:6px;border:2px solid var(--muted);flex:none;display:inline-flex;align-items:center;justify-content:center;font-size:14px;line-height:1;color:#1C1C1E;font-weight:600}
.step.done .cbox{background:var(--dot-ok);border-color:var(--dot-ok)}
.step.na .cbox{background:var(--dot-low);border-color:var(--dot-low)}
.stt{flex:1;font-size:15px;line-height:1.35;padding-top:1px}
.step.done .stt,.step.na .stt{color:var(--muted)}
.step-m{color:var(--muted);font-size:13px;margin:-4px 0 6px 36px}
.step-p{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px 10px 10px;margin:4px 0 8px}
.acts0{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.acts0 button,.acts0 select{padding:7px 11px;min-height:38px;font-size:14px;background:var(--card2);border:1px solid var(--line);width:auto;max-width:100%;border-radius:10px;color:var(--text);margin:0}
.acts0 button.primary{background:var(--btn)}
.mini{display:flex;align-items:flex-start;gap:9px;padding:9px 4px 9px 8px;border-bottom:1px solid var(--line);cursor:pointer;min-height:44px;border-left:5px solid transparent}
.mini.p1{border-left-color:var(--dot-high)} .mini.p2{border-left-color:var(--rail-normal)} .mini.p3{border-left-color:var(--dot-low)}
.mini .dot{margin-top:5px}
.mt{flex:1;font-size:15px;line-height:1.35}
.mw{color:var(--muted)}
.md{font-size:15px;font-weight:500;flex:none}
.mini-b{border:1px solid var(--line);border-radius:12px;margin:6px 0 10px;overflow:hidden}
.kv{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv .k{color:var(--muted);flex:0 0 42%}
.kv .v{flex:1;white-space:pre-wrap;min-width:0;overflow-wrap:anywhere}
.hist{font-size:14px;padding:6px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.hist .hm{color:var(--muted);font-size:13px}
.hidden{display:none!important}
.foot{color:var(--muted);font-size:13px;margin-top:18px;text-align:center}

/* ---------- v11: modern look ---------- */
:root{--bg:#18191C;--card:#222328;--card2:#2A2B31;--line:#34353C;--text:#E2E2E4;--muted:#A0A0A8;--btn:#33343B;--tab:#26272C;--tab-on:#3E3F48;--r:16px}
:root[data-theme="light"]{--bg:#F3F1EC;--card:#FFFFFF;--card2:#F6F4EF;--line:#E0DCD2;--text:#1E1E20;--muted:#5E5E64;--btn:#ECE8DF;--tab:#E9E5DB;--tab-on:#D6D0C2}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:0 14px calc(96px + env(safe-area-inset-bottom));max-width:720px}
header{position:sticky;top:0;z-index:4;background:var(--bg);padding:14px 0 10px}
h1{font-size:20px;font-weight:600;letter-spacing:-.2px;display:flex;align-items:center;gap:10px}
h1 .logo{width:28px;height:28px;border-radius:8px;background:var(--card2);border:1px solid var(--line);display:inline-grid;place-items:center;font-size:13px;font-weight:600}
button{border-radius:12px}
.card,.deal,.pinfo,.ccard,.brief,form.panel{border-radius:var(--r)}
:root[data-theme="light"] .card,:root[data-theme="light"] .deal,:root[data-theme="light"] .ccard,:root[data-theme="light"] .brief,:root[data-theme="light"] .lead{box-shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.04)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;margin:0;padding:6px 8px calc(6px + env(safe-area-inset-bottom));gap:4px;background:var(--card);border-top:1px solid var(--line);justify-content:center}
.tabs button{flex:1;max-width:140px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:12px;background:transparent;min-height:52px}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{background:var(--tab-on)}
.fab{bottom:calc(76px + env(safe-area-inset-bottom));border-radius:18px}
.fab2{display:none!important}
.toast{bottom:calc(140px + env(safe-area-inset-bottom))}
.strip{gap:8px}
.strip span{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 10px}
/* directory */
.dtools{padding:6px 0 8px}
#dQ{font-size:16px;padding:12px 14px;border-radius:14px;background:var(--card)}
.hscroll{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.hscroll::-webkit-scrollbar{display:none}
.seg{flex:none;white-space:nowrap;padding:8px 12px;min-height:38px;font-size:14px;background:var(--tab);border:1px solid var(--line);border-radius:999px;display:inline-flex;align-items:center;gap:6px}
.seg span{color:var(--muted);font-size:13px}
.seg.on{background:var(--tab-on)}
.seg.sm{padding:6px 10px;min-height:34px;font-size:13px}
.pipe{display:flex;height:8px;border-radius:6px;overflow:hidden;margin-top:8px;background:var(--card2)}
.pipe i{display:block;height:100%}
.drow2{display:flex;gap:8px;margin-top:8px}
.drow2 select{flex:1;font-size:15px;padding:9px;border-radius:12px}
.drow2 button{flex:none;min-height:40px}
.lcount{color:var(--muted);font-size:13px;margin:6px 2px}
.lead{scroll-margin-top:72px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;border-left:5px solid transparent;overflow:hidden}
.lead.p0,.lead.p1{border-left-color:var(--dot-high)} .lead.p2{border-left-color:var(--rail-normal)} .lead.p3{border-left-color:var(--dot-low)}
.lr{display:flex;align-items:flex-start;gap:12px;padding:12px 12px 12px 10px;cursor:pointer}
.av{flex:none;width:40px;height:40px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-size:14px;font-weight:600;margin-top:2px}
.av.sm{width:32px;height:32px;font-size:12px}
.lm{flex:1;min-width:0}
.ln{font-size:16px;font-weight:600;line-height:1.3}
.ls{color:var(--muted);font-size:14px;margin-top:2px;overflow-wrap:anywhere}
.lt{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;align-items:center}
.flagm{font-size:14px;color:var(--muted)}
.el{display:inline-flex;align-items:baseline;gap:2px;min-width:30px;height:24px;padding:0 6px;border-radius:6px;background:var(--card2);border:1px solid var(--line);font-size:13px;justify-content:center;align-items:center}
.el b{font-weight:600} .el i{font-style:normal;font-size:10px;color:var(--muted)}
.lc{padding:0 14px 14px;border-top:1px solid var(--line)}
.warn{display:flex;gap:10px;align-items:flex-start;background:var(--card2);border:1px solid var(--line);border-left:4px solid var(--dot-high);border-radius:12px;padding:10px 12px;margin-top:12px;font-size:15px}
.warn .dot{margin-top:4px}
.bigacts{display:grid;grid-template-columns:repeat(auto-fit,minmax(58px,1fr));gap:6px;margin-top:12px}
.bigacts button{min-height:46px;font-weight:500;font-size:14px;padding:8px 4px;line-height:1.2;background:var(--btn);border:1px solid var(--line)}
.about{white-space:pre-wrap;font-size:15px;line-height:1.45;overflow-wrap:anywhere}
.person{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.person:last-of-type{border-bottom:0}
.pm{flex:1;min-width:0}.pn{font-size:15px;font-weight:600}
.btnlink{display:inline-flex;align-items:center;min-height:38px;padding:7px 11px;border-radius:10px;background:var(--card2);border:1px solid var(--line);color:var(--text);text-decoration:none;font-size:14px}
.hdet,.libi{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.hdet summary,.libi summary{cursor:pointer;min-height:36px;display:flex;align-items:center;gap:8px;font-size:15px}
.cnote{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:8px 0;font-size:15px;white-space:pre-wrap}
.gs{color:var(--muted);font-size:13px;margin-top:3px}
.gates{padding:0 14px 8px}
.gate{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.gate .dot{margin-top:5px}.gt{flex:1}.gn{font-size:15px;font-weight:600}
.gate button{flex:none;padding:7px 11px;min-height:36px;font-size:14px}
.task{padding:10px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task.done .tt{color:var(--muted)}
.tl{display:flex;gap:8px;align-items:flex-start}
.tn{color:var(--muted);font-size:14px;min-width:16px;padding-top:3px}
.score{flex:none;min-width:26px;height:26px;border-radius:8px;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:600}

function dealsViewHtml(){

function render(){

  }
  let html = "";

    const groups = {};

    const order = Object.entries(groups).sort((a,b) => Math.min(...a[1].map(i=>i.priority||2)) - Math.min(...b[1].map(i=>i.priority||2)) || Math.max(...b[1].map(i=>i._days)) - Math.max(...a[1].map(i=>i._days)));

                       : `<div class="cstrip"><span>No number saved</span><button data-cnew="${esc(firstName(name))}">Add contact</button></div>`;

  } else if (view === "worklist") {
    html = todayHtml(items);
  } else if (view === "bot") {
    html += `<div class="chat">${chat.length ? chat.map((m, i) => m.role === "sugg" ? `<div class="sugg" data-si="${i}">${m.s.lead_id ? `Suggested for ${esc(m.s.lead_name || "lead")} · ${esc(m.s.field)}:\n${esc(m.s.field === "status" && ST[m.s.value] ? ST[m.s.value][0] : m.s.value)}${m.s.note ? "\n(" + esc(m.s.note) + ")" : ""}` : `Suggested for ${esc(m.s.target || m.s.project)} · ${esc(INFO_LABELS[m.s.field] || m.s.field)} (${esc(m.s.mode)}):\n${esc(m.s.text)}`}<div class="acts"><button class="primary" data-apply="${i}">Apply</button><button data-dismiss="${i}">Dismiss</button></div></div>` : `<div class="bub ${m.role === "user" ? "u" : m.role === "sys" ? "s" : "a"}">${esc(m.text)}</div>`).join("") : `<div class="bub s">Ask anything about the board or a deal, give it news or someone's number, or tap Daily brief. The bot only proposes — you confirm and tick.</div>`}${botBusy ? `<div class="bub s">Thinking…</div>` : ""}</div>
      <div class="ask"><textarea id="q" placeholder="e.g. What is still missing on the chrome deal? Save Piet's number 082 123 4567. Draft a message to Adrian."></textarea><button class="primary" data-bot="ask">Ask</button></div>
      <div class="acts" style="margin:10px 0 0"><button data-bot="brief">Daily brief</button><button data-bot="clear">Clear</button></div>
      <details class="keybox"${window._keyStatus === "not set" ? " open" : ""}><summary>Bot key: ${esc(window._keyStatus || "…")} — tap to set or change</summary>
        <input id="botKey" type="password" placeholder="Paste your Anthropic API key (starts with sk-ant-)" autocomplete="off">

        <div class="msg" id="keyMsg">The key is stored encrypted in the database. Only the bot can read it. Nobody, including Claude in chat, sees it.</div></details>`;
  } else {
    html = dealsViewHtml();
  }
  $("list").innerHTML = html;
  $("addBtn").classList.toggle("hidden", !me || view === "bot");
  $("foot").textContent = (me ? me + " · " : "") + "Updated " + new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}) + " · app v" + APP_VERSION;
}

  }

async function askBot(question, mode, focus, silent){
  if (botBusy) return;
  if (question) chat.push({ role: "user", text: question });
  botBusy = true; if (!silent) { view = "bot"; try{ localStorage.setItem("view", view) }catch(e){} } render();
  try {
    if (DEMO) throw new Error("Demo mode — the bot needs a real login.");
    const history = chat.filter(m => m.role !== "sys" && m.role !== "sugg").slice(-12, -1).map(m => ({ role: m.role === "user" ? "user" : "assistant", content: m.text }));
    const { data, error } = await sb.functions.invoke("ask", { body: { question: question || "", mode, history, focus: focus || "" } });
    if (error) { let msg = error.message || String(error); try { const j = await error.context.json(); if (j && j.error) msg = j.error; } catch(e){} throw new Error(msg); }
    chat.push({ role: "assistant", text: data.answer || "(no answer)" });
    if (data.actions && data.actions.length) chat.push({ role: "sys", text: data.actions.join("\n") });
    for (const s of (data.suggestions || [])) chat.push({ role: "sugg", s, text: "" });
    if (mode === "brief") window._brief = { text: data.brief ? JSON.stringify(data.brief) : (data.answer || ""), created_at: new Date().toISOString(), actor: me, for_date: "" };
    botBusy = false; render();
    if (data.reload || mode === "brief" || (data.actions || []).length) load(); else if (view === "bot") { window.scrollTo(0, document.body.scrollHeight); }
  } catch (err) {
    botBusy = false; chat.push({ role: "sys", text: "Bot error: " + (err.message || err) }); render();
  }
}
$("list").addEventListener("click", async e => {
  const bi = e.target.closest("button[data-botitem]"), bp = e.target.closest("button[data-botperson]"), bj = e.target.closest("button[data-botproj]");
  const ap = e.target.closest("button[data-apply]"), dm = e.target.closest("button[data-dismiss]");
  if (bi) { const it = (window._items || []).find(x => x.id === bi.dataset.botitem); if (!it) return;
    askBot(`About "${it.waiting_for}" (waiting on ${it.waiting_on}, ${it._days} days): what should I do next, what exactly do I ask, and draft the WhatsApp message. Set the next step if it is missing.`, "ask", it.id); return; }
  if (bp) { askBot(`Prep my chase with ${bp.dataset.botperson}: everything open with them in priority order, what to ask, what not to give away, and one WhatsApp message covering it all.`, "ask"); return; }
  if (bj) { askBot(`Review the ${bj.dataset.botproj} area: what is missing or contradictory, the top risks, the next 3 moves, and suggest any info updates.`, "ask"); return; }
  if (dm) { chat.splice(Number(dm.dataset.dismiss), 1); render(); return; }
  if (ap) {
    const m = chat[Number(ap.dataset.apply)]; if (!m || !m.s) return;
    const s = m.s, tgt = String(s.target || s.project || "").trim().toLowerCase();
    if (s.lead_id) {
      ap.disabled = true; ap.textContent = "…";
      const { error } = s.field === "status" ? await sb.rpc("lead_status", { p_id: s.lead_id, p_status: s.value, p_via: null, p_outcome: s.note || null }) : await sb.rpc("save_lead", { p_id: s.lead_id, p: { [s.field]: s.value } });
      if (error) { ap.textContent = "Failed"; toast(error.message, 5000); return; }
      chat.splice(Number(ap.dataset.apply), 1, { role: "sys", text: `Applied to ${s.lead_name || "the lead"} · ${s.field}.` }); render(); load(); return;
    }
    const merge = cur => (s.mode === "append" && (s.field === "key_facts" || s.field === "contacts")) ? (cur ? cur + "\n" + s.text : s.text) : s.text;
    const deal = (window._deals || []).find(d => d.name.toLowerCase() === tgt);
    ap.disabled = true; ap.textContent = "…";
    let error, where;
    if (deal) { where = deal.name; ({ error } = await sb.rpc("save_deal", { p_id: deal.id, ["p_" + s.field]: merge(deal[s.field] || "") })); }
    else {
      const p = (window._projects || []).find(x => x.name.toLowerCase() === tgt) || { name: s.target || s.project, summary:"", stage:"", key_facts:"", contacts:"", next_milestone:"" };
      where = p.name;
      const body = { p_name: p.name, p_summary: p.summary || "", p_stage: p.stage || "", p_key_facts: p.key_facts || "", p_contacts: p.contacts || "", p_next_milestone: p.next_milestone || "" };
      body["p_" + s.field] = merge(p[s.field] || "");
      ({ error } = await sb.rpc("set_project", body));
    }
    if (error) { ap.textContent = "Failed"; toast(error.message, 5000); return; }
    chat.splice(Number(ap.dataset.apply), 1, { role: "sys", text: `Applied to ${where} · ${INFO_LABELS[s.field] || s.field}.` }); render(); load(); return;
  }
});
